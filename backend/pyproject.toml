[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Michael <abmichael109@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
django = ">=5.2.7,<6.0.0"
djangorestframework = ">=3.16.1,<4.0.0"
django-cors-headers = ">=4.9.0,<5.0.0"
python-dotenv = ">=1.1.1,<2.0.0"
dj-rest-auth = {extras = ["with-social"], version = ">=7.0.1,<8.0.0"}
django-allauth = ">=65.13.0,<66.0.0"
requests = ">=2.32.5,<3.0.0"
pyjwt = ">=2.10.1,<3.0.0"
cryptography = ">=46.0.3,<47.0.0"
channels = ">=4.1.0,<5.0.0"
channels-redis = ">=4.2.0,<5.0.0"
uvicorn = {extras = ["standard"], version = ">=0.38.0,<0.39.0"}
daphne = ">=4.1.0,<5.0.0"
psycopg2-binary = ">=2.9.9,<3.0.0"
beautifulsoup4 = "^4.14.3"
django-filter = "^25.2"
sentry-sdk = "^2.57.0"
django-cloudinary-storage = "^0.3.0"
cloudinary = "^1.44.1"
firebase-admin = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
